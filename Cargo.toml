[package]
name = "dprint-plugin-alejandra"
version = "0.1.0"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-alejandra"
keywords = ["formatting", "formatter", "nix", "alejandra"]
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-alejandra"
description = "Nix formatter for dprint via Alejandra."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[dependencies]
alejandra = { git = "https://github.com/kamadorueda/alejandra", tag = "4.1.0" }
dprint-core = { version = "0.75.0", default-features = false }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2"

[dev-dependencies]
dprint-development = "0.12.1"
serde_json = { version = "1.0" }
